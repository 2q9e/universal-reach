[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-reach"
version = "0.1.0"
description = "Local-first read-only access to public social and community platforms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=1.0,<2"]

[project.scripts]
universal-reach = "universal_reach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
